<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e6e0ef"><title>Timer</title><meta name="description" content="Countdown, stopwatch and lap splits."><link rel="icon" href="favicon.svg?v=timer-t02-2" type="image/svg+xml"><link rel="alternate icon" href="favicon.png?v=timer-t02-2" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=timer-t02-2"><link rel="stylesheet" href="shared.css?v=timer-t02-2"><link rel="stylesheet" href="style.css?v=timer-t02-2"></head><body class="t02"><div class="app-shell"><header class="app-header"><h1><svg class="clock-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="22" r="13" stroke="currentColor" stroke-width="2.2"/><path d="M20 22V13m0 9 6 4M15 3h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Timer<i>.</i></span></h1><nav class="tabs" aria-label="Mode"><button class="tab active" id="timerTab" type="button" aria-pressed="true">Timer</button><button class="tab" id="stopwatchTab" type="button" aria-pressed="false">Stopwatch</button></nav><a class="back-link" href="https://wzzzodiac.github.io/" aria-label="WZC Personal Lab — Home">WZC <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8"/></svg></a></header><main class="app" aria-label="Timer and stopwatch"><section class="content" id="timerPanel" aria-label="Countdown"><div class="instrument"><div class="time-reading"><div class="status" id="timerStatus" role="status">Ready</div><div class="display" id="timerDisplay" aria-live="polite">05:00</div><progress class="linear-progress" max="100" value="100" aria-label="Time remaining"></progress></div><div class="controls"><button class="btn primary" id="startPause" type="button">Start</button><button class="btn" id="resetTimer" type="button">Reset</button><button class="btn quiet" id="clearTimer" type="button">Clear</button></div></div><aside class="settings" aria-label="Timer settings"><h2>Set your time.</h2><div class="editor" aria-label="Set timer duration"><div class="field"><label for="hours">Hours</label><input id="hours" type="number" inputmode="numeric" min="0" max="99" value="0"></div><div class="field"><label for="minutes">Minutes</label><input id="minutes" type="number" inputmode="numeric" min="0" max="59" value="5"></div><div class="field"><label for="seconds">Seconds</label><input id="seconds" type="number" inputmode="numeric" min="0" max="59" value="0"></div></div><div class="adjustments" aria-label="Adjust duration"><button class="btn" data-adjust="-60" type="button">−1 min</button><button class="btn" data-adjust="60" type="button">+1 min</button><button class="btn" data-adjust="300" type="button">+5 min</button><button class="btn" data-adjust="600" type="button">+10 min</button></div><h2 class="section-label">Quick presets</h2><div class="presets" aria-label="Quick presets"><button class="btn preset" data-seconds="60" type="button">1 min</button><button class="btn preset" data-seconds="90" type="button">1:30</button><button class="btn preset" data-seconds="120" type="button">2 min</button><button class="btn preset" data-seconds="180" type="button">3 min</button><button class="btn preset" data-seconds="300" type="button">5 min</button><button class="btn preset" data-seconds="600" type="button">10 min</button><button class="btn preset" data-seconds="900" type="button">15 min</button><button class="btn preset" data-seconds="1500" type="button">25 min</button></div></aside></section><section class="content hidden" id="stopwatchPanel" aria-label="Stopwatch"><div class="instrument"><div class="time-reading"><div class="status" id="stopwatchStatus" role="status">Ready</div><div class="display" id="stopwatchDisplay" aria-live="polite">00:00.0</div><progress class="linear-progress" max="100" value="100" aria-label="Stopwatch minute"></progress></div><div class="stopwatch-controls controls"><button class="btn primary" id="stopwatchStartPause" type="button">Start</button><button class="btn" id="lapButton" type="button" disabled>Lap</button><button class="btn" id="stopwatchReset" type="button">Reset</button></div></div><aside class="settings lap-book" aria-label="Lap records"><h2>Laps.</h2><div class="lap-heading"><span>LAP</span><span>TOTAL</span><span>SPLIT</span></div><div class="laps" id="laps"><div class="laps-empty">No laps yet</div></div></aside></section></main><footer class="app-footer"><p class="hint" id="keyboard-hint">Space · start / pause <span>R · reset</span></p><span class="mode-caption">TIMER + STOPWATCH</span></footer></div><div class="alarm-overlay hidden" id="alarmOverlay" role="dialog" aria-modal="true" aria-labelledby="alarmTitle"><div class="alarm-card"><svg class="clock-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="22" r="13" stroke="currentColor" stroke-width="2.2"/><path d="M20 22V13m0 9 6 4M15 3h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><h2 id="alarmTitle">Time’s up.</h2><button class="btn primary" id="alarmOkay" type="button">Okay</button></div></div><script src="engine.js?v=timer-t02-2"></script><script src="presentation.js?v=timer-t02-2"></script></body></html>
